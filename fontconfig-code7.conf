<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make code7w the first fallback for code7, so terminals that pick fallback fonts
     through fontconfig (gnome-terminal, kitty and others) draw emoji and other wide
     characters from code7w rather than from whatever other font covers them first.
     setup-ttf.sh installs this as ~/.config/fontconfig/conf.d/50-code7.conf. -->
<fontconfig>
	<alias binding="strong">
		<family>code7</family>
		<prefer>
			<family>code7</family>
			<family>code7w</family>
		</prefer>
	</alias>
</fontconfig>
